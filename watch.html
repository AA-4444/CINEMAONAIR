<script>
const video = document.getElementById('videoPlayer');
const playOverlay = document.getElementById('playOverlay');
const progressFill = document.getElementById('progressFill');
const playerTime = document.getElementById('playerTime');

function togglePlay() {
  if (video.paused) { video.play(); playOverlay.style.display = 'none'; }
  else { video.pause(); playOverlay.style.display = 'flex'; }
}
function toggleMute() { video.muted = !video.muted; }
function goFullscreen() { const w = document.querySelector('.player-wrap'); if (w.requestFullscreen) w.requestFullscreen(); }
function seekVideo(e) { const bar = document.getElementById('progressBar'); const r = bar.getBoundingClientRect(); video.currentTime = ((e.clientX - r.left) / r.width) * video.duration; }
function formatTime(s) { const m = Math.floor(s/60); const sec = Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
video.addEventListener('timeupdate', () => { if(video.duration){progressFill.style.width=(video.currentTime/video.duration*100)+'%';playerTime.textContent=formatTime(video.currentTime)+' / '+formatTime(video.duration)} });
video.addEventListener('play', () => { playOverlay.style.display = 'none'; });
video.addEventListener('pause', () => { playOverlay.style.display = 'flex'; });
video.addEventListener('click', togglePlay);

function addBookmark(id) { /* POST /api/bookmarks */ }
function shareMovie(id) { if(navigator.share)navigator.share({url:location.href});else navigator.clipboard.writeText(location.href) }
</script>
